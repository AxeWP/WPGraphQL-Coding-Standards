version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    # Runtime deps are user-facing (they change which sniffs consumers get), so
    # `build` cuts a release. Dev-only deps are `chore` and stay out of the changelog.
    commit-message:
      prefix: "build"
      prefix-development: "chore"
      include: "scope"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      composer-minor-patch:
        update-types: [minor, patch]
      composer-major:
        update-types: [major]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions-updates:
        patterns: ["*"]
